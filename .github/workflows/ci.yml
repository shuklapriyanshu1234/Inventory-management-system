name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client
        run: |
          cd server
          npx prisma generate
          npx prisma db push

      - name: Seed Database
        run: |
          cd server
          npx tsx prisma/seed.ts

      - name: Run Test Suite
        run: |
          cd server
          npm test

      - name: Compile TypeScript
        run: |
          cd server
          npm run build
